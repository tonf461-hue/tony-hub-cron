name: brain-morning-brief

# Schedule-only ping (generates + delivers the morning brief server-side).
on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST brain/brief-and-deliver
        env:
          TBONE_BRIDGE_TOKEN: ${{ secrets.TBONE_BRIDGE_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://t-bone-bridge.fly.dev/api/v1/brain/brief-and-deliver" \
            -H "Authorization: Bearer $TBONE_BRIDGE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"deliver": true}' --max-time 120)
          CODE=$(echo "$RESPONSE" | tail -1)
          echo "HTTP: $CODE"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE" >&2; exit 1; }
