name: Tai Proactive Refresh

# Schedule OWNED by combined-tai-http-30min.yml (2026-07-31 consolidation).
# This file is workflow_dispatch-only — manual fallback / isolation debug.
# To revert: re-add `schedule: - cron: '*/30 * * * *'` and remove the
# proactive step from combined-tai-http-30min.yml.
#
# WHY A GH TWIN STILL EXISTS (even though vercel.json lists this path):
# the route authenticates with TAI_CRON_SECRET only (not Vercel CRON_SECRET),
# and production is Fly (tai-web.fly.dev) after VERCEL-EXIT — Vercel Cron
# would hit lagging heytai.app. Do not "fix" by weakening route auth.

env:
  TAI_CRON_URL: ${{ vars.TAI_CRON_URL }}

on:
  workflow_dispatch: {}

jobs:
  proactive-refresh:
    name: Refresh proactive items + reach-out gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run proactive refresh
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://tai-web.fly.dev"
          echo "→ POSTing to ${URL}/api/cron/proactive-refresh …"
          RESPONSE=$(curl -sf \
            -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${URL}/api/cron/proactive-refresh")
          # Public logs: counts + reason codes only — no item content.
          echo "$RESPONSE" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print('ok:', r.get('ok'))
          print('itemCount:', r.get('itemCount'))
          print('suppressed:', r.get('suppressed'))
          print('bySeverity:', r.get('bySeverity'))
          print('push:', r.get('push'))
          ro = r.get('reachOut') or {}
          print('reachOut.sent:', ro.get('sent'), '| reason:', ro.get('reason'))
          "
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))")
          if [ "$OK" != "True" ] && [ "$OK" != "true" ]; then
            echo "ERROR: proactive-refresh returned ok=false" >&2
            exit 1
          fi
