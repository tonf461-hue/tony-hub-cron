name: Tai Proactive Refresh

# Driver for Tai's proactive intelligence engine (/api/cron/proactive-refresh).
#
# WHY THIS EXISTS: the route was registered ONLY as a Vercel-native cron.
# Vercel-native crons authenticate with the auto-injected CRON_SECRET — which
# is not set on that project — so the job has 401'd on every scheduled run
# since it shipped, and the proactive alerts + reach-out push lane never ran.
# Every WORKING Tai cron is driven by a GitHub Actions twin that sends
# `Authorization: Bearer ${TAI_CRON_SECRET}` explicitly. This is that twin,
# copied from the proven pattern (tai-memory-distill et al).
#
# What the endpoint does per run (idempotent, no LLM):
#   1. Scans live spine rows (bills, court, deadlines, refills, appointments).
#   2. Upserts the ranked alert items; clears its own stale rows; never touches
#      dismissed/resolved ones.
#   3. Reach-out discipline: at most ONE push, only for a critical item, with
#      quiet hours (22:00–07:59 Chicago) and an 18h same-item cooldown —
#      enforced server-side.
#
# Log hygiene: this is a PUBLIC repo — only counts and reason codes are
# printed, never item titles or content.

env:
  TAI_CRON_URL: ${{ vars.TAI_CRON_URL }}

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  proactive-refresh:
    name: Refresh proactive items + reach-out gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run proactive refresh
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${TAI_CRON_URL:-https://heytai.app}"
          echo "→ POSTing to ${URL}/api/cron/proactive-refresh …"
          RESPONSE=$(curl -sf \
            -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${URL}/api/cron/proactive-refresh")
          # Public logs: counts + reason codes only — no item content.
          echo "$RESPONSE" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print('ok:', r.get('ok'))
          print('itemCount:', r.get('itemCount'))
          print('suppressed:', r.get('suppressed'))
          print('bySeverity:', r.get('bySeverity'))
          print('push:', r.get('push'))
          ro = r.get('reachOut') or {}
          print('reachOut.sent:', ro.get('sent'), '| reason:', ro.get('reason'))
          "
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))")
          if [ "$OK" != "True" ] && [ "$OK" != "true" ]; then
            echo "ERROR: proactive-refresh returned ok=false" >&2
            exit 1
          fi
