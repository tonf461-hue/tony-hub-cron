name: tai-dining-intel

# Twin for Tai's /api/cron/dining-intel (Vercel-native cron 401s — see
# tai-dining-sync.yml header). Runs sync-dining FIRST so a same-day booking is
# promoted before the dossier pass, then pre-bakes the Restaurant Intelligence
# PDF for any reservation happening today. 13:50 UTC = 8:50 AM CT, ahead of the
# lunch window.
#
# SCHEDULE DISABLED 2026-08-14 — this lane can no longer succeed, and had been
# failing every single day since 2026-07-19.
#
#   * /api/cron/dining-intel is now a deliberate COST BOUNDARY: the route is a
#     fail-closed 410 tombstone, kept precisely "so an old manual workflow or
#     forgotten caller cannot spend". Restaurant Intel is on-demand only, via
#     Tony's Get Intel / Menu tap (POST /api/dining/intel-pdf). A daily cron
#     against it is the exact caller that tombstone exists to stop.
#   * The sync-dining call this workflow makes first is fully redundant:
#     tai-dining-sync.yml in this repo runs it '10 */2 * * *' (green), and
#     tony-hub's tai-sync-dining.yml runs it '0 */4 * * *'.
#
# So the only thing the schedule bought was one red billed ubuntu-latest run per
# day. workflow_dispatch is kept — re-enabling is uncommenting two lines, and
# that call is Tony's, not this workflow's.
on:
  # schedule:
  #   - cron: '50 13 * * *'
  workflow_dispatch: {}

env:
  TAI_CRON_URL: ${{ vars.TAI_CRON_URL }}

concurrency:
  group: tai-dining-intel
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST sync-dining then dining-intel
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${TAI_CRON_URL:-https://heytai.app}"

          SYNC=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${URL}/api/cron/sync-dining")
          echo "$SYNC" | python3 -m json.tool

          INTEL=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            "${URL}/api/cron/dining-intel")
          echo "$INTEL" | python3 -m json.tool
          OK=$(echo "$INTEL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))")
          { [ "$OK" = "True" ] || [ "$OK" = "true" ]; } || { echo "ERROR: ok=false" >&2; exit 1; }
