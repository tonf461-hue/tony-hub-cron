name: opportunity-refresh

# ⚠ SCHEDULE DISABLED until TAI_CRON_SECRET is set on this repo with the
#   value that authenticates against heytai.app (copy from the private repo's
#   GitHub secret, or from Vercel project tai-preview env). The private-repo
#   twin keeps running on schedule until then — no coverage gap. To activate:
#   set the secret, then uncomment the `schedule:` block below.

# Schedule-only ping (refreshes the daily focus/opportunity selection server-side).
on:
  # schedule:
  #   - cron: '0 1 * * *'   # ENABLE after TAI_CRON_SECRET set
  workflow_dispatch: {}

concurrency:
  group: opportunity-refresh
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST opportunity-refresh
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "https://tai-preview-liart.vercel.app/api/cron/opportunity-refresh")
          echo "$RESPONSE" | python3 -m json.tool
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))")
          { [ "$OK" = "True" ] || [ "$OK" = "true" ]; } || { echo "ERROR: ok=false" >&2; exit 1; }
