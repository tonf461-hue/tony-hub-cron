name: brain-cloud-ingest

# Schedule-only ping. Triggers an async re-ingest on the cognition service so the
# cloud store stays fresh when the local machine is off. Returns immediately.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /admin/ingest
        env:
          COGNITION_TOKEN: ${{ secrets.COGNITION_BRAIN_TOKEN }}
        run: |
          set -uo pipefail
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${COGNITION_TOKEN}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            "https://t-bone-cognition.fly.dev/admin/ingest") || true
          CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP ${CODE}: $(echo "$RESPONSE" | sed '$d')"
          [ "$CODE" = "200" ] || { echo "::error::HTTP ${CODE}" >&2; exit 1; }
