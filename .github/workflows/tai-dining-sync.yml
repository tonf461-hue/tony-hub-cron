name: tai-dining-sync

# Twin for Tai's /api/cron/sync-dining (Vercel-native cron 401s — no CRON_SECRET
# env on the Vercel project, and minting one would break every twin that
# authenticates with TAI_CRON_SECRET; see Claude Hub
# data/comprehensive_review/ dining pipeline finding 2026-07-16).
# Promotes "Reservation at X" calendar events into tai_dining_reservations.
on:
  schedule:
    - cron: '10 */2 * * *'
  workflow_dispatch: {}

env:
  TAI_CRON_URL: ${{ vars.TAI_CRON_URL }}

concurrency:
  group: tai-dining-sync
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST sync-dining
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${TAI_CRON_URL:-https://heytai.app}"
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${URL}/api/cron/sync-dining")
          echo "$RESPONSE" | python3 -m json.tool
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))")
          { [ "$OK" = "True" ] || [ "$OK" = "true" ]; } || { echo "ERROR: ok=false" >&2; exit 1; }
