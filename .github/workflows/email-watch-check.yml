name: email-watch-check

# Schedule OWNED by combined-tai-http-30min.yml (2026-07-31 consolidation).
# This file is workflow_dispatch-only — manual fallback / isolation debug.
# To revert: re-add `schedule: - cron: '*/30 * * * *'` and remove the
# email-watch step from combined-tai-http-30min.yml.

# Schedule-only ping to a token-gated endpoint (full email-watch matcher).
on:
  workflow_dispatch: {}

env:
  # Prefer Fly production (VERCEL-EXIT). Repo var may still lag on heytai.
  TAI_CRON_URL: https://tai-web.fly.dev

concurrency:
  group: email-watch-check
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST email-watch-check
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${TAI_CRON_URL:-https://tai-web.fly.dev}"
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "${URL}/api/cron/email-watch-check")
          echo "$RESPONSE" | python3 -m json.tool
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))")
          { [ "$OK" = "True" ] || [ "$OK" = "true" ]; } || { echo "ERROR: ok=false" >&2; exit 1; }
