name: brain-cadence-weekly

# Schedule-only ping (weekly review).
on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST brain/weekly-review
        env:
          TBONE_BRIDGE_TOKEN: ${{ secrets.TBONE_BRIDGE_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://t-bone-bridge.fly.dev/api/v1/brain/weekly-review" \
            -H "Authorization: Bearer $TBONE_BRIDGE_TOKEN" \
            -H "Content-Type: application/json" -d '{}' --max-time 120)
          echo "HTTP: $CODE"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE" >&2; exit 1; }
