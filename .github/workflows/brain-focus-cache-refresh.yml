name: brain-focus-cache-refresh

# Schedule-only ping. Keeps a server-side synthesis cache warm (both horizons).
# The request triggers background LLM synthesis and may exceed the curl timeout
# even though the server received it — so a timeout is a soft warning, not a failure.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Refresh focus cache (today + week)
        env:
          TBONE_BRIDGE_TOKEN: ${{ secrets.TBONE_BRIDGE_TOKEN }}
        run: |
          for H in today week; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://t-bone-bridge.fly.dev/api/v1/brain/focus" \
              -H "Authorization: Bearer $TBONE_BRIDGE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"horizon\":\"${H}\"}" --max-time 60) || CODE="timeout"
            echo "horizon=${H} HTTP=${CODE}"
            if [ "$CODE" != "200" ]; then
              echo "::warning::focus ${H} returned ${CODE} (cache warm still triggered server-side)"
            fi
          done
          echo "focus cache refresh dispatched for both horizons"
