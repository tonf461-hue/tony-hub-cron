name: gmail-watch-renew

# ⚠ SCHEDULE DISABLED until TAI_CRON_SECRET is set on this repo with the
#   value that authenticates against heytai.app (copy from the private repo's
#   GitHub secret, or from Vercel project tai-preview env). The private-repo
#   twin keeps running on schedule until then — no coverage gap. To activate:
#   set the secret, then uncomment the `schedule:` block below.

# Schedule-only ping. Renews a Gmail Pub/Sub push watch every 6 days (expires at 7).
on:
  # schedule:
  #   - cron: '0 6 */6 * *'   # ENABLE after TAI_CRON_SECRET set
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST gmail-push/renew
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
          TAI_APP_URL: ${{ secrets.TAI_APP_URL }}
        run: |
          set -euo pipefail
          BASE="${TAI_APP_URL:-https://heytai.app}"
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            "${BASE}/api/webhooks/gmail-push/renew")
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0) if d.get('ok') else (print('ERROR:', d.get('error')) or sys.exit(1))"
