name: cubs-pregame-push

# ⚠ SCHEDULE DISABLED until TAI_CRON_SECRET is set on this repo with the
#   value that authenticates against heytai.app (copy from the private repo's
#   GitHub secret, or from Vercel project tai-preview env). The private-repo
#   twin keeps running on schedule until then — no coverage gap. To activate:
#   set the secret, then uncomment the `schedule:` block below.

# Schedule-only ping to a token-gated endpoint. The target route decides whether
# to act (it sends a pregame push only when first pitch is ~55-65 min out and
# deduplicates by game). No app code or data lives here.

on:
  # schedule:
  #   - cron: '*/30 * * * *'   # ENABLE after TAI_CRON_SECRET set
  workflow_dispatch: {}

concurrency:
  group: cubs-pregame-push
  cancel-in-progress: true

jobs:
  ping:
    name: Cubs pregame push tick
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST cubs-pregame-push
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf -w "\n%{http_code}" -X POST \
            "https://heytai.app/api/cron/cubs-pregame-push" \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"
          [ "$HTTP_CODE" = "200" ] || { echo "::warning::returned HTTP $HTTP_CODE"; }
