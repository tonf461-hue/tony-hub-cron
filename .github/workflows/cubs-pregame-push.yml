name: cubs-pregame-push

# Schedule-only ping to a token-gated endpoint. The target route decides whether
# to act (it sends a pregame push only when first pitch is ~55-65 min out and
# deduplicates by game). No app code or data lives here.
#
# HOST: vars.TAI_CRON_URL (https://tai-web.fly.dev). This used to hardcode
# heytai.app, which is a Cloudflare 301 to usetai.app. `curl -sf` does not follow
# redirects and -f only fails on >=400, so from 2026-08-07T14:46 onward every
# single tick got a 301, never reached the app, and still reported success —
# 6+ days of total failure rendered as ~288 green runs while the Heartbeat Board
# correctly showed cubs-pregame-push dark since 2026-08-07T14:25.
#
# The stale header that used to sit here claimed the schedule was DISABLED
# pending a secret. It was not disabled — it has been firing every 30 minutes.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

env:
  TAI_CRON_URL: ${{ vars.TAI_CRON_URL }}

concurrency:
  group: cubs-pregame-push
  cancel-in-progress: true

jobs:
  ping:
    name: Cubs pregame push tick
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST cubs-pregame-push
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${TAI_CRON_URL:-https://tai-web.fly.dev}"
          echo "→ POST ${URL}/api/cron/cubs-pregame-push"
          # -L so a host that 301s is followed rather than silently accepted; no
          # -f so a non-2xx is inspected here instead of collapsing to exit 22.
          RESPONSE=$(curl -sL -w "\n%{http_code}" -X POST \
            "${URL}/api/cron/cubs-pregame-push" \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"
          # FAIL LOUD. This was `::warning::` and passing, which is exactly how a
          # totally broken lane stayed green for six days. A tick that cannot
          # reach the route is a failed tick and must be red.
          [ "$HTTP_CODE" = "200" ] || { echo "::error::cubs-pregame-push returned HTTP $HTTP_CODE"; exit 1; }
