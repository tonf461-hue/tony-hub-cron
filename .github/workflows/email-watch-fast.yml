name: email-watch-fast

# Schedule REMOVED 2026-07-31 (CRON-30MIN-CONSOLIDATION).
#
# Why not kept in the combined workflow:
#   fast_only=true only filters watches with check_faster=true. The full
#   email-watch-check (no query) already includes those rows. The fast lane
#   only paid for itself when it ran MORE often than the full check
#   (historical: fast */10 vs full */20). Both had been cut to */30, so a
#   second boot every half-hour was pure waste at zero latency win.
#
# workflow_dispatch retained for one-off manual isolation tests.
# To restore a true fast lane: schedule this more often than the full check
# (e.g. */10) — do not re-add at the same cadence as the full matcher.

on:
  workflow_dispatch: {}

env:
  TAI_CRON_URL: https://tai-web.fly.dev

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST email-watch-check (fast lane)
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${TAI_CRON_URL:-https://tai-web.fly.dev}"
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "${URL}/api/cron/email-watch-check?fast_only=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'checked={d.get(\"checked\",0)} triggered={d.get(\"triggered\",0)} pushSent={d.get(\"pushSent\",0)}')"
