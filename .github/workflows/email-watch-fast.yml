name: email-watch-fast

# ⚠ SCHEDULE DISABLED until TAI_CRON_SECRET is set on this repo with the
#   value that authenticates against heytai.app (copy from the private repo's
#   GitHub secret, or from Vercel project tai-preview env). The private-repo
#   twin keeps running on schedule until then — no coverage gap. To activate:
#   set the secret, then uncomment the `schedule:` block below.

# Schedule-only ping to a token-gated endpoint (fast-lane subset).
on:
  # schedule:
  #   - cron: '*/30 * * * *'   # ENABLE after TAI_CRON_SECRET set
  workflow_dispatch: {}

env:
  TAI_CRON_URL: ${{ vars.TAI_CRON_URL }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST email-watch-check (fast lane)
        env:
          TAI_CRON_SECRET: ${{ secrets.TAI_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${TAI_CRON_URL:-https://heytai.app}"
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${TAI_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "${URL}/api/cron/email-watch-check?fast_only=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'checked={d.get(\"checked\",0)} triggered={d.get(\"triggered\",0)} pushSent={d.get(\"pushSent\",0)}')"
